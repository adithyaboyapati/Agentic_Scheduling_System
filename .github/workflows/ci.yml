name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Backend Python CI (Matrix: Python 3.10 & 3.11)
  # ============================================================================
  backend-ci:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite (50 Tests)
        env:
          OPENAI_API_KEY: "sk-mock-ci-key-for-automated-validation"
          GROQ_API_KEY: "gsk_mock_ci_key_for_automated_validation"
          LANGCHAIN_TRACING_V2: "false"
          PYTHONPATH: "agent_system"
        run: |
          pytest agent_system/tests -v

  # ============================================================================
  # 2. Frontend React CI (Oxlint & Vite Build)
  # ============================================================================
  frontend-ci:
    name: Frontend Lint & Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Build Production Assets (Vite)
        run: npm run build

  # ============================================================================
  # 3. Security & Repository Hygiene Check
  # ============================================================================
  security-audit:
    name: Security & Secret Leak Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Accidentally Tracked Secrets or Databases
        run: |
          echo "Scanning git tracked files for prohibited files (.env, *.db)..."
          PROHIBITED_FILES=$(git ls-files | grep -E '\.env$|\.db$|\.db-wal$|\.db-shm$' || true)
          if [ -n "$PROHIBITED_FILES" ]; then
            echo "❌ ERROR: Found prohibited files tracked in git:"
            echo "$PROHIBITED_FILES"
            exit 1
          fi
          echo "✅ No sensitive or database files are tracked in git."
